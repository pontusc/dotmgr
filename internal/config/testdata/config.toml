# Repository sources
[repositories.dotfiles]
url = "git@github.com:pontusc/.dotfiles.git"

[repositories.private-infra]
url = "git@github.com:pontusc/infra-configs.git"

# Entries — direct copy (default strategy)
[yamlfmt]
path = "~/.config/yamlfmt/config"
source = { repository = "dotfiles", path = "yamlfmt/config" }

[sesh]
path = "~/.config/sesh/config.toml"
source = { repository = "dotfiles", path = "sesh/config.toml" }

[starship]
path = "~/.config/starship.toml"
source = { repository = "dotfiles", path = "starship/starship.toml", ref = "main" }

[gitconfig]
path = "~/.gitconfig"
source = { repository = "dotfiles", path = "git/gitconfig" }

[nvim]
path = "~/.config/nvim"
source = { repository = "dotfiles", path = "nvim/" }

[hyprland]
path = "~/.config/hypr"
source = { repository = "dotfiles", path = "hypr/" }

# Entry from a separate private repo
[ssh-allowed-signers]
path = "~/.ssh/allowed_signers"
symlink = false
source = { repository = "private-infra", path = "ssh/allowed_signers" }
